# 自动生成；公开模板中的 ${SUB_URL} 必须由用户在本地替换。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
geodata-mode: true
ipv6: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  - +.msftconnecttest.com
  - +.msftncsi.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  respect-rules: true
  nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver-policy:
    geosite:cn:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    geosite:geolocation-!cn:
    - https://cloudflare-dns.com/dns-query#节点选择
    - https://dns.google/dns-query#节点选择
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
proxy-providers:
  subscription:
    type: http
    url: ${SUB_URL}
    path: ./providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - DIRECT
  use:
  - subscription
rule-providers:
  ads_reject:
    type: http
    behavior: classical
