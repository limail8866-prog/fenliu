# Clash Verge Rev：订阅 → 全局扩展覆写配置（Merge），粘贴本文件完整内容。
# 使用当前选中订阅的节点；无需填写订阅 URL，不合并其他订阅卡片。
# 替换策略组、分流规则及 DNS 设置；保存后使用规则模式并选择实际节点。
profile:
  store-selected: true
geodata-mode: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  - +.msftconnecttest.com
  - +.msftncsi.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  respect-rules: true
  nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  nameserver-policy:
    geosite:cn:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
    geosite:geolocation-!cn:
    - https://cloudflare-dns.com/dns-query#节点选择
    - https://dns.google/dns-query#节点选择
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - DIRECT
  include-all-proxies: true
  include-all-providers: true
rule-providers:
  fenliu_ads_reject:
    type: http
    behavior: classical
    format: yaml
    url: https://cdn.jsdelivr.net/gh/limail8866-prog/fenliu@gh-pages/clash/ads_reject.yaml
    path: ./rules/fenliu/ads_reject.yaml
    interval: 86400
  fenliu_ads_reject_domain:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/limail8866-prog/fenliu@gh-pages/clash/ads_reject_domain.mrs
