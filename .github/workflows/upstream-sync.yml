name: Weekly upstream rule refresh

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Advance pinned upstream commits
        run: python tools/bump_upstream.py
      - name: Import upstream rules and preserve manual entries
        run: python tools/sync_rules.py --write --cache-dir "$RUNNER_TEMP/upstream-cache"
      - name: Validate, build and test the proposed update
        run: |
          python validate.py
          python build.py
          python -m pytest
      - name: Open or update review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/weekly-upstream-rules
          delete-branch: true
          title: 'chore: refresh upstream routing rules'
          commit-message: 'chore: refresh upstream routing rules'
          body: |
            Weekly candidate update from the pinned upstream rule sources.

            Generated by `tools/bump_upstream.py` and `tools/sync_rules.py`; validate, build, and pytest ran before opening this pull request. Please review rule changes and conflict reports before merging.
