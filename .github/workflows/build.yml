name: Validate, build and publish rules

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate sources
        run: python validate.py
      - name: Build public artifacts (subscription stays a placeholder)
        run: python build.py
      - name: Install pinned Mihomo rule-set compiler
        run: |
          archive="$RUNNER_TEMP/mihomo-linux-amd64-v1.19.32.gz"
          curl --fail --location --silent --show-error "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz" --output "$archive"
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $archive" | sha256sum --check
          gzip --decompress --stdout "$archive" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test converters and validation
        run: python -m pytest
      - name: Rebuild optimized MRS rule providers
        run: python build.py --mrs
      - name: Validate config with Mihomo
        run: |
          mihomo -d "$RUNNER_TEMP/mihomo-home" -t -f dist/clash/config.yaml
          mihomo -d "$RUNNER_TEMP/mihomo-home" -t -f dist/clash/merge.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: validate-build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish dist as gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          force_orphan: true
          enable_jekyll: false
          commit_message: 'Publish generated rules'
